services:
  app: &app
    hostname: app
    env_file:
    - path: .env
      required: true
    - path: override.env
      required: false
    ports:
      - "8000:8000"
    build:
      context: src
      dockerfile: Dockerfile
    restart: always
    volumes:
      - .docker/media:/opt/arbonotifica/media
      - .docker/static:/opt/arbonotifica/static
      - ./src/api:/opt/arbonotifica/api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: curl http://127.0.0.1:8000/api/about/
    working_dir: /opt/arbonotifica
    entrypoint: ./entrypoint.sh

  db:
    image: postgres:15
    restart: always
    env_file:
    - path: .env
      required: true
    - path: override.env
      required: false
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - 5432
    volumes:
      - .docker/postgres:/var/lib/postgresql/data
    profiles:
      - dev
    
  mail:
      image: axllent/mailpit:latest
      ports:
        - "8025:8025"
        - "1025"
      environment:
        MP_MAX_MESSAGES: 500
        TZ: America/Recife
      healthcheck:
        test: ["CMD", "/mailpit", "readyz"]
        interval: 10s
        timeout: 5s
        retries: 5
        start_period: 10s
      profiles:
      - dev
